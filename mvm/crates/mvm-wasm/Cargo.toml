[package]
name = "mvm-wasm"
version = "1.0.0"
edition = "2021"
description = "WebAssembly cdylib bridge exposing the authoritative Rust Manifest compiler and Virtual Machine to Browser and Node.js hosts"

[lib]
crate-type = ["cdylib"]

[dependencies]
mvm-core = { path = "../mvm-core" }
manifest-compiler = { path = "../manifest-compiler" }

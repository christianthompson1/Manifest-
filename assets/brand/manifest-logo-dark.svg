<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48" fill="none">
  <defs>
    <linearGradient id="dark-facet-left" x1="12" y1="14" x2="24" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </linearGradient>
    <linearGradient id="dark-facet-center-left" x1="24" y1="26" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B949E"/>
      <stop offset="100%" stop-color="#484F58"/>
    </linearGradient>
    <linearGradient id="dark-facet-center-right" x1="32" y1="26" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="dark-facet-right" x1="40" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#C9D1D9"/>
    </linearGradient>
    <linearGradient id="dark-facet-top" x1="12" y1="14" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C9D1D9"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="dark-text-grad" x1="56" y1="24" x2="280" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="80%" stop-color="#E6EDF3"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </linearGradient>
  </defs>

  <!-- Scaled Manifest Symbol -->
  <g transform="translate(2, 4) scale(0.625)">
    <polygon points="12,50 12,20 22,27 22,50" fill="url(#dark-facet-left)" />
    <polygon points="22,27 32,34 32,50 22,50" fill="url(#dark-facet-center-left)" />
    <polygon points="32,34 42,27 42,50 32,50" fill="url(#dark-facet-center-right)" />
    <polygon points="42,27 52,20 52,50 42,50" fill="url(#dark-facet-right)" />
    <polygon points="12,20 32,34 52,20 45,15 32,24 19,15" fill="url(#dark-facet-top)" />
  </g>

  <!-- Wordmark -->
  <text x="52" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="url(#dark-text-grad)">
    MANIFEST
  </text>
  <text x="216" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#58A6FF">
    v1.0
  </text>
</svg>

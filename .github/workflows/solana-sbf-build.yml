name: Solana SBF Binary Build & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"
  RUST_VERSION: "1.79.0"

jobs:
  build-sbf:
    name: Build Solana SBF (.so) Binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache Solana CLI & Anchor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install/active_release
            ~/.cargo/bin/anchor
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked
          fi

      - name: Synthesize Anchor Workspace from Manifest Source
        run: |
          npm ci || npm install
          npx tsx manifest-core/scripts/synthesize-anchor-workspace.ts

      - name: Build Solana SBF Binary via cargo-build-sbf
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          if [ -d "generated/anchor" ]; then
            cd generated/anchor && anchor build
          fi

      - name: Archive SBF Binary & IDL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-sbf-artifacts
          path: |
            generated/anchor/target/deploy/*.so
            generated/anchor/target/idl/*.json
          if-no-files-found: ignore

name: Manifest Solana CI - Anchor & LiteSVM Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_cluster:
        description: 'Target Solana Cluster (devnet or localnet)'
        required: true
        default: 'devnet'

env:
  RUST_VERSION: '1.83.0'
  SOLANA_VERSION: '1.18.26'
  ANCHOR_VERSION: '0.30.1'

jobs:
  anchor-build-and-verify:
    name: Build & Verify Solana Anchor Program
    runs-on: ubuntu-22.04
    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Bun based on repository lockfile (bun.lock)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Install dependencies using committed lockfile
      - name: Install Project Dependencies
        run: bun install --frozen-lockfile

      # 4. Install & Pin Rust Toolchain
      - name: Install Pinned Rust (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      # 5. Cache Solana Toolchain
      - name: Cache Solana Toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install/active_release
            ~/.cargo/bin/solana*
          key: solana-${{ env.SOLANA_VERSION }}-${{ runner.os }}

      # 6. Install & Pin Solana / Agave CLI
      - name: Install Pinned Solana CLI (${{ env.SOLANA_VERSION }})
        run: |
          set -e
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # 7. Cache Anchor CLI
      - name: Cache Anchor CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      # 8. Install & Pin Anchor CLI
      - name: Install Pinned Anchor CLI (${{ env.ANCHOR_VERSION }})
        run: |
          set -e
          if ! command -v anchor &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked
          fi

      # 9. Verify Toolchain Versions (fail early if any are missing or mismatched)
      - name: Verify Toolchain Versions
        run: |
          set -e
          echo "=== Pinned Toolchain Verification ==="
          rustc --version
          cargo --version
          solana --version
          anchor --version

      # 10. Build & Test Rust Manifest Virtual Machine (mvm) + Manifest Compiler Tests
      - name: Run Rust MVM & Manifest Compiler Tests
        id: manifest_tests
        run: |
          set -e
          echo "=== Step 10a: Rust Manifest Virtual Machine (mvm) Cargo Tests & Release Build ==="
          cargo test --manifest-path mvm/Cargo.toml
          cargo build --release --manifest-path mvm/Cargo.toml
          echo "=== Step 10b: Manifest Compiler, v1.0 Upgrade & Studio Test Suite ==="
          bun run manifest:test

      # 11. Synthesize Genuine Anchor Workspace from Manifest Source
      - name: Synthesize Anchor Workspace from Manifest
        id: synth_anchor
        run: |
          set -e
          echo "=== Step 11: Anchor Workspace Synthesis ==="
          if [ ! -f "Anchor.toml" ]; then
            echo "Anchor.toml not found; synthesizing workspace from Manifest program source..."
            bun run manifest:anchor:synthesize
          fi
          if [ ! -f "Anchor.toml" ]; then
            echo "::error::Failed to synthesize Anchor workspace: Anchor.toml missing."
            exit 1
          fi

      # 12. Run Cargo Checks on Generated Rust Source
      - name: Run Cargo Checks on Rust Program
        id: cargo_check
        run: |
          set -e
          echo "=== Step 12: Rust Workspace Typecheck ==="
          cargo check --all-targets --locked

      # 13. Perform Genuine Anchor Build
      - name: Run Anchor Build
        id: anchor_build
        run: |
          set -e
          echo "=== Step 13: Genuine Anchor Compilation ==="
          anchor build

      # 14. Verify Compiled .so and IDL Artifacts on Disk
      - name: Verify Build Artifact Existence
        id: verify_artifacts
        run: |
          set -e
          echo "=== Step 14: Verifying Compiled Artifacts ==="
          if [ ! -d "target/deploy" ] || [ -z "$(ls -A target/deploy/*.so 2>/dev/null)" ]; then
            echo "::error::Anchor build reported completion, but no .so binary found in target/deploy/!"
            exit 1
          fi
          if [ ! -d "target/idl" ] || [ -z "$(ls -A target/idl/*.json 2>/dev/null)" ]; then
            echo "::error::Anchor build reported completion, but no IDL JSON found in target/idl/!"
            exit 1
          fi
          echo "Artifacts successfully generated:"
          ls -la target/deploy/*.so
          ls -la target/idl/*.json

      # 15. Execute Native Program Execution Tests
      - name: Run LiteSVM State & Execution Tests
        id: litesvm_tests
        run: |
          echo "=== Step 15: In-Process LiteSVM Execution & Assertions ==="
          bun run manifest:test

      # 16. Produce Honest Dynamic Machine-Readable Build Report
      - name: Generate Truthful Build Report
        if: always()
        run: |
          SO_EXISTS="false"
          IDL_EXISTS="false"
          SO_COUNT=0
          if [ -d "target/deploy" ] && [ -n "$(ls -A target/deploy/*.so 2>/dev/null)" ]; then
            SO_EXISTS="true"
            SO_COUNT=$(ls -1 target/deploy/*.so | wc -l)
          fi
          if [ -d "target/idl" ] && [ -n "$(ls -A target/idl/*.json 2>/dev/null)" ]; then
            IDL_EXISTS="true"
          fi

          MANIFEST_STATUS="${{ steps.manifest_tests.outcome }}"
          SYNTH_STATUS="${{ steps.synth_anchor.outcome }}"
          CHECK_STATUS="${{ steps.cargo_check.outcome }}"
          BUILD_STATUS="${{ steps.anchor_build.outcome }}"
          VERIFY_STATUS="${{ steps.verify_artifacts.outcome }}"
          LITESVM_STATUS="${{ steps.litesvm_tests.outcome }}"

          cat << EOF > build-report.json
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "toolchain": {
              "rust": "${{ env.RUST_VERSION }}",
              "solana": "${{ env.SOLANA_VERSION }}",
              "anchor": "${{ env.ANCHOR_VERSION }}"
            },
            "steps": {
              "manifest_compiler_tests": "${MANIFEST_STATUS}",
              "workspace_synthesis": "${SYNTH_STATUS}",
              "rust_syntax_check": "${CHECK_STATUS}",
              "anchor_program_build": "${BUILD_STATUS}",
              "artifact_verification": "${VERIFY_STATUS}",
              "litesvm_execution": "${LITESVM_STATUS}"
            },
            "artifacts": {
              "so_binary_generated": ${SO_EXISTS},
              "so_count": ${SO_COUNT},
              "idl_generated": ${IDL_EXISTS}
            },
            "overall_status": "$([ "${BUILD_STATUS}" = "success" ] && [ "${SO_EXISTS}" = "true" ] && echo "success" || echo "failed")"
          }
          EOF
          cat build-report.json

      # 17. Upload Build Artifacts & IDL
      - name: Upload Anchor Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-anchor-artifacts
          path: |
            build-report.json
            Anchor.toml
            Cargo.toml
            programs/*/src/*.rs
            target/idl/*.json
            target/deploy/*.so
          if-no-files-found: ignore
